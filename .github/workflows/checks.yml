name: Addon checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check JavaScript
        shell: pwsh
        run: |
          Get-ChildItem src -Include *.js,*.mjs -Recurse | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Syntax check failed: $($_.Name)" }
          }
      - name: Build standalone installer
        run: python scripts/build.py
      - name: Verify portable FFmpeg
        shell: pwsh
        run: |
          $dependency = (Get-Content installer/dependencies.json -Raw | ConvertFrom-Json).ffmpeg
          $archive = Join-Path $env:RUNNER_TEMP 'addon-ffmpeg.zip'
          Invoke-WebRequest -Uri $dependency.url -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ine $dependency.sha256) {
            throw 'FFmpeg archive checksum mismatch.'
          }
          $destination = Join-Path $env:RUNNER_TEMP 'addon-ffmpeg'
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $executable = Join-Path $destination ($dependency.prefix + $dependency.executable)
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) { throw 'FFmpeg executable missing.' }
          Split-Path -Parent $executable | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Test runtime and package
        run: python -m unittest discover -s tests -v
      - name: Test installation and rollback
        shell: powershell
        run: ./tests/test_installer.ps1
